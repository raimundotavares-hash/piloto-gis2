<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Painel da Turma</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;color:var(--p)}.container{max-width:1280px;margin:24px auto;padding:0 16px 50px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0000000c}.card{padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.btn,button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:25px;color:var(--p);margin-top:5px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:780px}th{background:var(--p);color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid var(--line)}.badge{display:inline-block;background:#edf5f3;color:var(--p);font-weight:800;font-size:11px;border-radius:999px;padding:5px 8px}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px}.good{font-weight:900;color:var(--p)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.stats{grid-template-columns:1fr}}</style></head><body><header><div class="brand">IDOMED • Gestão Avaliativa</div><div><a id="back" class="btn light" href="professor-area.html">← Disciplina</a> <button class="light" onclick="logout()">Sair</button></div></header><div class="container"><div class="card"><div class="top"><div><span class="badge" id="course">DISCIPLINA</span><h1 id="title">Carregando...</h1><p id="term" class="muted"></p></div><a class="btn primary" href="avaliacao.html">+ Nova avaliação</a></div></div><div class="stats"><div class="stat"><span>Alunos</span><b id="sStudents">–</b></div><div class="stat"><span>Avaliações</span><b id="sAssessments">–</b></div><div class="stat"><span>Resultados</span><b id="sResults">–</b></div><div class="stat"><span>Média da turma</span><b id="sAverage">–</b></div><div class="stat"><span>Maior desempenho</span><b id="sHigh">–</b></div></div><div class="card"><div class="top"><div><h2>Alunos da turma</h2><p class="muted">Clique no aluno para acompanhar histórico, média e evolução individual.</p></div><a class="btn light" href="avaliacao.html">Cadastrar/importar alunos</a></div><div id="students" class="scroll"></div></div><div class="card"><h2>Avaliações da turma</h2><div id="assessments"></div></div></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-academic-dashboard',token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role'),$=id=>document.getElementById(id),CLASS_ID=new URLSearchParams(location.search).get('class_id')||'';if(!token||role!=='professor')location.href='plataforma.html';if(!CLASS_ID)location.href='professor-area.html';async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}function pct(v){return v==null?'—':Number(v).toFixed(1)+'%'}function status(s){const m={blueprint:'Blueprint',review:'Em revisão',approved:'Aprovada'};return m[s]||s||'—'}async function load(){try{const d=await call({action:'class_dashboard',class_id:CLASS_ID});$('course').textContent=(d.course.code||'')+' • '+d.course.name;$('title').textContent=d.class.name;$('term').textContent=d.class.term||'Período não informado';$('back').href='disciplina-painel.html?course_id='+encodeURIComponent(d.course.id);$('sStudents').textContent=d.summary.students;$('sAssessments').textContent=d.summary.assessments;$('sResults').textContent=d.summary.results;$('sAverage').textContent=pct(d.summary.average_percent);$('sHigh').textContent=pct(d.summary.highest_percent);$('students').innerHTML=d.students.length?`<table><thead><tr><th>Matrícula</th><th>Aluno</th><th>Avaliações com resultado</th><th>Média</th><th></th></tr></thead><tbody>${d.students.map(s=>`<tr><td>${s.institutional_id}</td><td><strong>${s.full_name}</strong><div class="muted">${s.email||''}</div></td><td>${s.assessment_results}</td><td class="good">${pct(s.average_percent)}</td><td><a class="btn light" href="aluno-painel.html?class_id=${encodeURIComponent(CLASS_ID)}&student_id=${encodeURIComponent(s.id)}">Analisar aluno</a></td></tr>`).join('')}</tbody></table>`:'<div class="notice">Nenhum aluno cadastrado nesta turma. Use “Cadastrar/importar alunos”.</div>';$('assessments').innerHTML=d.assessments.length?d.assessments.map(a=>`<div style="padding:12px 0;border-bottom:1px solid #d7e5e2"><strong>${a.title}</strong><div class="muted">${a.assessment_type||'Avaliação'} • ${a.total_points} pontos • ${status(a.status)}</div></div>`).join(''):'<p class="muted">Nenhuma avaliação criada para esta turma.</p>'}catch(e){$('students').innerHTML='<div class="notice">Não foi possível carregar a turma.</div>'}}load();</script></body></html>
