<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Administração da Plataforma</title><style>:root{--p:#005b55;--o:#f47c20;--bg:#f3f7f6;--line:#d8e4e2;--muted:#657270;--red:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--o);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{color:var(--p);font-size:21px;font-weight:900}.container{max-width:1320px;margin:25px auto;padding:0 16px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 28px #00000010;margin-bottom:16px}.grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px}h1,h2,h3{color:var(--p)}label{display:block;font-weight:700;margin:9px 0 5px}input,select{width:100%;padding:10px;border:1px solid #bcc9c6;border-radius:9px;font-size:14px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.btn{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.danger{background:#fff0ee;color:var(--red)}.muted{color:var(--muted);font-size:12px}.courses{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{padding:6px 9px;border-radius:999px;background:#edf5f3;color:var(--p);font-size:12px}.user{padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.roles{font-size:11px;font-weight:800;color:var(--o);margin-top:4px}.status{font-size:11px;font-weight:800}.active{color:#2e7d32}.inactive{color:var(--red)}.coursechecks{display:flex;flex-wrap:wrap;gap:8px}.coursechecks label{display:inline-flex;align-items:center;gap:5px;margin:0;padding:7px 9px;background:#f5f9f8;border:1px solid var(--line);border-radius:9px;font-weight:600}.coursechecks input{width:auto}.manage{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.manage-grid{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.error,.notice{background:#fff4e9;border-left:5px solid var(--o);padding:14px;border-radius:9px}@media(max-width:900px){.grid,.manage-grid{grid-template-columns:1fr}}</style></head><body><header><div class="brand">IDOMED • Administração da Plataforma</div><button class="light" onclick="logout()">Sair</button></header><div class="container"><div class="grid"><div><div class="card"><h2>Adicionar professor</h2><label>Nome completo</label><input id="name"><label>Matrícula / identificação institucional</label><input id="inst"><label>E-mail</label><input id="email" type="email"><label>Senha temporária</label><input id="temp" type="password"><label>Disciplinas iniciais</label><div id="courseChecks" class="coursechecks"></div><button class="btn" style="margin-top:14px" onclick="createProfessor()">Cadastrar professor</button><p class="muted">As disciplinas também podem ser adicionadas ou removidas depois do cadastro.</p></div><div class="card"><h2>Cadastrar nova disciplina</h2><label>Nome da disciplina</label><input id="courseName" placeholder="Ex.: IESC III"><label>Código / sigla</label><input id="courseCode" placeholder="Ex.: IESC3"><label>Instituição</label><input id="courseInstitution" value="IDOMED"><button class="btn" style="margin-top:12px" onclick="createCourse()">Cadastrar disciplina</button><div id="courseMsg" style="margin-top:10px"></div></div></div><div class="card"><div class="row"><div><h2 style="margin-top:0">Professores cadastrados</h2><p class="muted">Abra a gestão de cada professor para vincular ou remover disciplinas.</p></div><button class="light" onclick="load()">Atualizar</button></div><div id="users"><div class="muted">Carregando usuários...</div></div></div></div></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-admin',$=id=>document.getElementById(id),token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role');if(!token||role!=='admin')location.href='plataforma.html';let DATA={};async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok){const e=new Error(d.error||'erro');e.data=d;throw e}return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}async function load(){DATA=await call({action:'overview'});const courses=(DATA.courses||[]).filter(c=>c.active);$('courseChecks').innerHTML=courses.map(c=>`<label><input type="checkbox" value="${c.id}">${c.name}</label>`).join('');renderUsers()}function roles(userId){return(DATA.roles||[]).filter(r=>r.user_id===userId).map(r=>r.role).join(', ')}function linkedIds(userId){return(DATA.links||[]).filter(l=>l.teacher_id===userId).map(l=>l.course_id)}function linkedCourses(userId){const ids=linkedIds(userId);return(DATA.courses||[]).filter(c=>ids.includes(c.id))}function renderUsers(){const profiles=(DATA.profiles||[]).filter(u=>roles(u.id).includes('professor'));$('users').innerHTML=profiles.length?profiles.map(u=>{const linked=linkedCourses(u.id),linkedSet=new Set(linked.map(c=>c.id)),available=(DATA.courses||[]).filter(c=>c.active&&!linkedSet.has(c.id));return `<div class="user"><div class="row"><div><strong>${u.full_name}</strong><div class="muted">${u.institutional_id} • ${u.email||''}</div><div class="roles">${roles(u.id)||'sem papel'}</div><div class="courses">${linked.map(c=>`<span class="chip">${c.name} <button style="padding:0 0 0 4px;background:transparent;color:#b3261e" onclick="removeCourse('${u.id}','${c.id}','${String(c.name).replace(/'/g,"\\'")}')">×</button></span>`).join('')||'<span class="muted">Nenhuma disciplina vinculada</span>'}</div></div><div><div class="status ${u.active?'active':'inactive'}">${u.active?'ATIVO':'INATIVO'}</div><button class="${u.active?'danger':'light'}" style="margin-top:7px" onclick="setActive('${u.id}',${!u.active})">${u.active?'Desativar':'Reativar'}</button></div></div><div class="manage"><strong>Adicionar disciplina</strong><div class="manage-grid"><select id="sel_${u.id}"><option value="">Selecione...</option>${available.map(c=>`<option value="${c.id}">${c.name}${c.code?' ('+c.code+')':''}</option>`).join('')}</select><button class="btn" onclick="addCourse('${u.id}')">Vincular</button></div></div></div>`}).join(''):'<div class="muted">Nenhum professor cadastrado.</div>'}async function createProfessor(){const selected=[...document.querySelectorAll('#courseChecks input:checked')].map(i=>i.value),institutional_id=$('inst').value.trim(),full_name=$('name').value.trim(),email=$('email').value.trim(),temporary_password=$('temp').value;if(!institutional_id||!full_name||!email||!temporary_password)return alert('Preencha nome, matrícula, e-mail e senha temporária.');if(temporary_password.length<8)return alert('A senha temporária precisa ter pelo menos 8 caracteres.');try{const r=await call({action:'create_professor',institutional_id,full_name,email,temporary_password});for(const course_id of selected)await call({action:'assign_course',user_id:r.user_id,course_id,enabled:true});$('name').value=$('inst').value=$('email').value=$('temp').value='';await load();alert('Professor cadastrado com sucesso.')}catch(e){alert('Não foi possível cadastrar o professor. Verifique matrícula/e-mail.')}}async function createCourse(){const name=$('courseName').value.trim(),code=$('courseCode').value.trim(),institution=$('courseInstitution').value.trim()||'IDOMED';if(!name)return alert('Informe o nome da disciplina.');try{await call({action:'create_course',name,code,institution});$('courseName').value='';$('courseCode').value='';$('courseMsg').innerHTML='<div class="notice">Disciplina cadastrada com sucesso.</div>';await load()}catch(e){$('courseMsg').innerHTML='<div class="notice">Não foi possível cadastrar. A disciplina pode já existir.</div>'}}async function addCourse(userId){const el=$('sel_'+userId),courseId=el?.value;if(!courseId)return alert('Selecione uma disciplina.');await call({action:'assign_course',user_id:userId,course_id:courseId,enabled:true});await load()}async function removeCourse(userId,courseId,name){if(!confirm('Remover a disciplina “'+name+'” deste professor? Isso não exclui a disciplina do sistema.'))return;await call({action:'assign_course',user_id:userId,course_id:courseId,enabled:false});await load()}async function setActive(userId,active){if(!confirm(active?'Reativar este usuário?':'Desativar este usuário?'))return;await call({action:'set_active',user_id:userId,active});await load()}load().catch(()=>{document.querySelector('.container').innerHTML='<div class="error">Não foi possível acessar a Administração da Plataforma.<br><br><button class="light" onclick="logout()">Voltar ao login</button></div>'});</script></body></html>
