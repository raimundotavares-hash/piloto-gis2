<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Painel do Aluno</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573;--danger:#a83224}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;color:var(--p)}.container{max-width:1220px;margin:24px auto;padding:0 16px 50px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0000000c}.card{padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.btn,button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.light{background:#edf5f3;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.stat{padding:15px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:22px;color:var(--p);margin-top:5px}.timeline{border-left:3px solid var(--line);margin-left:8px;padding-left:20px}.event{position:relative;padding:3px 0 18px}.event:before{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:var(--p);left:-27px;top:8px}.score{font-size:23px;font-weight:900;color:var(--p)}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.metric{padding:10px 0;border-bottom:1px solid var(--line)}.bar{height:9px;background:#e6efed;border-radius:999px;overflow:hidden;margin-top:5px}.bar span{display:block;height:100%;background:var(--p)}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#edf5f3;color:var(--p);font-weight:800;font-size:12px;margin:3px}.gap{background:#fff0ed;color:var(--danger)}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="brand">IDOMED • Gestão Avaliativa</div><div><a id="back" class="btn light" href="professor-area.html">← Turma</a> <button class="light" onclick="logout()">Sair</button></div></header><div class="container"><div class="card"><div class="top"><div><div id="context" class="muted">Carregando...</div><h1 id="name">Aluno</h1><div id="idline" class="muted"></div></div></div></div><div class="stats"><div class="stat"><span>Avaliações</span><b id="sAssessments">–</b></div><div class="stat"><span>Com resultado</span><b id="sCompleted">–</b></div><div class="stat"><span>Média geral</span><b id="sAverage">–</b></div><div class="stat"><span>Melhor</span><b id="sBest">–</b></div><div class="stat"><span>Tendência</span><b id="sTrend">–</b></div><div class="stat"><span>Vs. turma</span><b id="sCompare">–</b></div></div><div class="card"><h2>Evolução e histórico</h2><div id="history" class="timeline"></div></div><div class="grid2"><div class="card"><h2>Pontos fortes</h2><div id="strengths"></div></div><div class="card"><h2>Lacunas prioritárias</h2><div id="gaps"></div></div></div><div class="grid2"><div class="card"><h2>Desempenho por conteúdo</h2><div id="content"></div></div><div class="card"><h2>Desempenho por Bloom</h2><div id="bloom"></div></div></div><div class="card"><h2>Objetivos de aprendizagem</h2><div id="objectives"></div></div></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-academic-dashboard',token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role'),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),CLASS_ID=q.get('class_id')||'',STUDENT_ID=q.get('student_id')||'';if(!token||role!=='professor')location.href='plataforma.html';if(!CLASS_ID||!STUDENT_ID)location.href='professor-area.html';async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}function pct(v){return v==null?'—':Number(v).toFixed(1)+'%'}function pp(v){return v==null?'—':(v>0?'+':'')+Number(v).toFixed(1)+' p.p.'}function date(v){try{return new Date(v).toLocaleDateString('pt-BR')}catch{return''}}function metrics(o){const e=Object.entries(o||{});return e.length?e.sort((a,b)=>Number(b[1].percent||0)-Number(a[1].percent||0)).map(([k,v])=>`<div class="metric"><div class="top"><strong>${k}</strong><span>${pct(v.percent)}</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(v.percent||0)))}%"></span></div></div>`).join(''):'<p class="muted">Sem dados suficientes.</p>'}function tags(a,cls=''){return (a||[]).length?(a||[]).map(x=>`<span class="tag ${cls}">${x.name} • ${pct(x.percent)}</span>`).join(''):'<p class="muted">Sem dados suficientes.</p>'}async function load(){try{const d=await call({action:'student_dashboard',class_id:CLASS_ID,student_id:STUDENT_ID});$('context').textContent=(d.course.code||'')+' • '+d.course.name+' • '+d.class.name;$('name').textContent=d.student.full_name;$('idline').textContent='Matrícula: '+d.student.institutional_id+(d.student.email?' • '+d.student.email:'');$('back').href='turma-painel.html?class_id='+encodeURIComponent(CLASS_ID);$('sAssessments').textContent=d.summary.assessments;$('sCompleted').textContent=d.summary.completed;$('sAverage').textContent=pct(d.summary.average_percent);$('sBest').textContent=pct(d.summary.best_percent);$('sTrend').textContent=pp(d.summary.trend_percent);$('sCompare').textContent=pp(d.summary.difference_from_class);$('history').innerHTML=d.history.length?d.history.map(a=>`<div class="event"><div class="top"><div><strong>${a.title}</strong><div class="muted">${a.assessment_type||'Avaliação'} • ${date(a.created_at)}</div></div><div class="score">${a.result&&a.result.status==='completed'?pct(a.result.percent):a.result?.status==='absent'?'Ausente':'—'}</div></div><div class="muted">${a.result&&a.result.status==='completed'?'Nota: '+a.result.score+' / '+(a.result.max_score??a.total_points)+' • média da turma '+pct(a.class_average_percent)+' • diferença '+pp(a.difference_from_class):'Resultado não finalizado'}</div></div>`).join(''):'<div class="notice">Ainda não existem avaliações nesta turma.</div>';$('strengths').innerHTML=tags(d.strengths);$('gaps').innerHTML=tags(d.gaps,'gap');$('content').innerHTML=metrics(d.content_stats);$('bloom').innerHTML=metrics(d.bloom_stats);$('objectives').innerHTML=metrics(d.objective_stats)}catch(e){$('history').innerHTML='<div class="notice">Não foi possível carregar o aluno.</div>'}}load();</script></body></html>
