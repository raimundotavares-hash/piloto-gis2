<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Pós-aplicação</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--p);font-size:21px}.container{max-width:1360px;margin:24px auto;padding:0 16px 50px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0000000c}.card{padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.btn,button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.stat{padding:15px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:24px;color:var(--p);margin-top:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#edf5f3;color:var(--p)}.tab.active{background:var(--p);color:#fff}.pane{display:none}.pane.active{display:block}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th{background:var(--p);color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid var(--line)}.bar{height:10px;background:#e7efed;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--p)}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px}.report{background:#fff}.report-head{border-bottom:3px solid var(--p);padding-bottom:10px;margin-bottom:16px}.tag{display:inline-block;background:#edf5f3;color:var(--p);font-weight:800;border-radius:999px;padding:5px 9px;font-size:12px}.metricRow{padding:9px 0;border-bottom:1px solid var(--line)}select{padding:10px;border:1px solid #bdcbc8;border-radius:8px;font:inherit}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}}@media print{header,.tabs,.no-print{display:none!important}.container{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:0}.pane{display:none!important}.pane.active{display:block!important}.report{font-size:11pt}.pagebreak{page-break-before:always}}</style></head><body><header><div class="brand">IDOMED • Pós-aplicação</div><div><a id="back" class="btn light" href="professor-area.html">← Voltar</a> <button class="light" onclick="logout()">Sair</button></div></header><div class="container"><div class="card"><div class="top"><div><h1 id="title">Carregando...</h1><div id="meta" class="muted"></div></div><div class="no-print"><button class="primary" onclick="window.print()">Imprimir / Salvar PDF</button> <button class="light" onclick="downloadCSV()">Baixar planilha CSV</button></div></div></div><div class="stats"><div class="stat"><span>Alunos</span><b id="sStudents">—</b></div><div class="stat"><span>Finalizados</span><b id="sDone">—</b></div><div class="stat"><span>Ausentes</span><b id="sAbsent">—</b></div><div class="stat"><span>Média</span><b id="sMean">—</b></div><div class="stat"><span>Maior nota</span><b id="sMax">—</b></div><div class="stat"><span>KR-20</span><b id="sKr">—</b></div></div><div class="tabs no-print"><button class="tab active" onclick="openTab('technical',this)">Relatório técnico</button><button class="tab" onclick="openTab('managerial',this)">Relatório gerencial</button><button class="tab" onclick="openTab('gaps',this)">Mapa de lacunas</button><button class="tab" onclick="openTab('premium',this)">Relatório Premium</button></div><section id="technical" class="pane active"><div class="card report"><div class="report-head"><h2>Relatório Técnico Pós-aplicação</h2><div id="techMeta" class="muted"></div></div><div id="techBody"></div></div></section><section id="managerial" class="pane"><div class="card report"><div class="report-head"><h2>Relatório Gerencial</h2></div><div id="managerBody"></div></div></section><section id="gaps" class="pane"><div class="card report"><div class="report-head"><h2>Mapa de Lacunas da Turma</h2></div><div id="gapBody"></div></div></section><section id="premium" class="pane"><div class="card"><div class="top"><div><h2>Relatório Premium Individual</h2><p class="muted">Selecione um aluno com resultado registrado.</p></div><select id="studentSelect" onchange="loadStudent()"></select></div></div><div id="premiumBody"></div></section></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-postapplication',token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role'),$=id=>document.getElementById(id),AID=new URLSearchParams(location.search).get('assessment_id')||'';let DATA=null,STUDENT=null;if(!token||role!=='professor')location.href='plataforma.html';if(!AID)location.href='professor-area.html';async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}function f(v,d=1){return v==null?'—':Number(v).toFixed(d)}function openTab(id,b){document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function rowsMetrics(arr){return (arr||[]).length?(arr||[]).map(x=>`<div class="metricRow"><div class="top"><strong>${x.name}</strong><span>${f(x.percent)}%</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(x.percent||0)))}%"></span></div></div>`).join(''):'<p class="muted">Sem dados suficientes.</p>'}function itemFlags(){const xs=DATA.critical_items||[];return xs.length?`<table><thead><tr><th>Questão</th><th>Conteúdo</th><th>Facilidade</th><th>Discriminação</th><th>Alertas</th></tr></thead><tbody>${xs.map(x=>`<tr><td>Q${x.item_number}</td><td>${x.content_area||'—'}</td><td>${x.facility==null?'—':f(x.facility*100)+'%'}</td><td>${f(x.discrimination,3)}</td><td>${(x.flags||[]).join(', ').replaceAll('_',' ')}</td></tr>`).join('')}</tbody></table>`:'<p>Nenhuma questão crítica identificada nos dados disponíveis.</p>'}function render(){const d=DATA,s=d.summary;$('title').textContent=d.assessment.title;$('meta').textContent=(d.course?.name||'Disciplina')+' • '+(d.class?.name||'Turma')+' • '+(d.assessment.assessment_type||'Avaliação');if(d.assessment.class_id)$('back').href='turma-painel.html?class_id='+encodeURIComponent(d.assessment.class_id);$('sStudents').textContent=s.students;$('sDone').textContent=s.completed;$('sAbsent').textContent=s.absent;$('sMean').textContent=s.mean_percent==null?'—':f(s.mean_percent)+'%';$('sMax').textContent=f(s.max_score,2);$('sKr').textContent=f(s.kr20,3);$('techMeta').textContent='Gerado a partir das correções e da Inteligência Avaliativa do sistema.';$('techBody').innerHTML=`<p><strong>Amostra:</strong> ${s.completed} estudantes com resultado finalizado; ${s.absent} ausente(s); ${s.pending} pendente(s).</p><p><strong>Desempenho:</strong> média ${f(s.mean_score,2)}, mediana ${f(s.median_score,2)}, mínimo ${f(s.min_score,2)} e máximo ${f(s.max_score,2)}.</p><p><strong>Confiabilidade interna:</strong> KR-20 ${f(s.kr20,3)}.</p><h3>Questões que exigem revisão</h3><div class="scroll">${itemFlags()}</div><h3>Desempenho por conteúdo</h3>${rowsMetrics(d.content_gaps)}`;$('managerBody').innerHTML=`<p>Este relatório sintetiza os achados para tomada de decisão docente e coordenação.</p><h3>Indicadores centrais</h3><ul><li>${s.completed} resultados finalizados de ${s.students} estudantes com registro.</li><li>Média percentual da turma: ${s.mean_percent==null?'—':f(s.mean_percent)+'%'}.</li><li>${(d.critical_items||[]).length} questão(ões) com alertas psicométricos.</li></ul><h3>Prioridades pedagógicas</h3>${rowsMetrics((d.content_gaps||[]).slice(0,5))}`;$('gapBody').innerHTML=`<h3>Conteúdos</h3>${rowsMetrics(d.content_gaps)}<h3>Objetivos de aprendizagem</h3>${rowsMetrics(d.objective_gaps)}<h3>Níveis de Bloom</h3>${rowsMetrics(d.bloom_gaps)}`;const options=(d.roster||[]).filter(x=>x.result?.status==='completed').map(x=>`<option value="${x.student.id}">${x.student.full_name} — ${x.student.institutional_id}</option>`).join('');$('studentSelect').innerHTML=options||'<option value="">Nenhum aluno finalizado</option>';if(options)loadStudent()}async function loadStudent(){const sid=$('studentSelect').value;if(!sid)return;$('premiumBody').innerHTML='<div class="card notice">Carregando...</div>';try{STUDENT=await call({assessment_id:AID,student_id:sid});const d=STUDENT,r=d.student_result,s=d.student;$('premiumBody').innerHTML=`<div class="card report"><div class="report-head"><span class="tag">RELATÓRIO PREMIUM</span><h2>${s.full_name}</h2><div class="muted">Matrícula: ${s.institutional_id} • ${d.course?.name||''} • ${d.class?.name||''}</div></div><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span>Nota</span><b>${f(r.score,2)} / ${f(r.max_score,2)}</b></div><div class="stat"><span>Desempenho</span><b>${f(r.percent)}%</b></div><div class="stat"><span>Acertos</span><b>${r.correct_items??'—'} / ${r.total_items??'—'}</b></div></div><h3>🌟 Pontos fortes</h3>${rowsMetrics(d.strengths)}<h3>🎯 Prioridades de aprendizagem</h3>${rowsMetrics(d.gaps)}<h3>📚 Desempenho por conteúdo</h3>${rowsMetrics(d.student_content)}<h3>🧠 Desempenho por Bloom</h3>${rowsMetrics(d.student_bloom)}<h3>Objetivos de aprendizagem</h3>${rowsMetrics(d.student_objectives)}</div>`}catch(e){$('premiumBody').innerHTML='<div class="card notice">Não foi possível gerar o relatório individual.</div>'}}function csvCell(v){const s=String(v??'');return '"'+s.replaceAll('"','""')+'"'}function downloadCSV(){if(!DATA)return;const lines=[['Matrícula','Aluno','Status','Nota','Máximo','Percentual'].map(csvCell).join(';')];for(const x of DATA.roster||[])lines.push([x.student.institutional_id,x.student.full_name,x.result.status,x.result.score,x.result.max_score,x.result.percent].map(csvCell).join(';'));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(DATA.assessment.title||'avaliacao')+'-resultados.csv';a.click();URL.revokeObjectURL(a.href)}async function load(){try{DATA=await call({assessment_id:AID});render()}catch(e){document.querySelector('.container').innerHTML='<div class="notice">Não foi possível carregar o pós-aplicação desta avaliação.</div>'}}load();</script></body></html>
