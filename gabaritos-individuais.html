<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Gabaritos individuais</title><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><style>:root{--p:#00685f;--line:#98aaa6}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef4f3;color:#111}.toolbar{position:sticky;top:0;z-index:5;background:#fff;padding:12px 20px;border-bottom:4px solid var(--p);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer;background:#edf5f3;color:var(--p)}.primary{background:var(--p);color:#fff}.page{width:210mm;height:297mm;background:#fff;margin:12px auto;position:relative;page-break-after:always;box-shadow:0 2px 12px #0002}.mark{position:absolute;width:7mm;height:7mm;background:#000}.m1{left:7mm;top:7mm}.m2{right:7mm;top:7mm}.m3{left:7mm;bottom:7mm}.m4{right:7mm;bottom:7mm}.head{position:absolute;left:15mm;right:15mm;top:13mm;border-bottom:2px solid var(--p);padding-bottom:5mm}.brand{font-size:17pt;font-weight:900;color:var(--p)}.meta{font-size:10pt;margin-top:2mm}.qr{position:absolute;right:17mm;top:22mm;width:32mm;height:32mm}.idbox{position:absolute;left:15mm;top:35mm;width:133mm;border:1px solid var(--line);padding:4mm;height:34mm}.grid{position:absolute;top:92mm;left:43.8mm;width:122.4mm;border-collapse:collapse;table-layout:fixed}.grid th,.grid td{border:1px solid #899;text-align:center;height:12mm;padding:0}.grid th{background:#eaf5f3;color:var(--p)}.bubble{display:inline-block;width:7mm;height:7mm;border:1.3px solid #111;border-radius:50%;vertical-align:middle}.note{position:absolute;top:232mm;left:25mm;right:25mm;font-size:9pt;text-align:center}.sig{position:absolute;bottom:18mm;left:20mm;right:20mm;border-top:1px solid #777;padding-top:3mm;font-size:9pt}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none}} </style></head><body><div class="toolbar"><a id="back" class="btn" href="professor-area.html">← Voltar</a><button class="primary" onclick="print()">Imprimir / Salvar PDF</button><span id="status"></span></div><div id="pages"></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-paper-correction',token=sessionStorage.getItem('platform_access_token'),AID=new URLSearchParams(location.search).get('assessment_id')||'';async function call(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{const d=await call({action:'qr_roster',assessment_id:AID}),obj=d.items.filter(i=>!(String(i.item_type||'').toLowerCase().includes('disc')||String(i.item_format||'').toUpperCase()==='DISCURSIVA'));document.getElementById('status').textContent=d.students.length+' gabaritos';if(d.assessment.class_id)document.getElementById('back').href='turma-painel.html?class_id='+d.assessment.class_id;document.getElementById('pages').innerHTML=d.students.map((s,ix)=>`<section class="page"><i class="mark m1"></i><i class="mark m2"></i><i class="mark m3"></i><i class="mark m4"></i><div class="head"><div class="brand">ESTÁCIO • IDOMED – IGUATU</div><div class="meta">FOLHA DE RESPOSTAS INDIVIDUAL • ${esc(d.assessment.title)}</div></div><div class="idbox"><strong>Aluno(a):</strong> ${esc(s.full_name)}<br><br><strong>Matrícula:</strong> ${esc(s.institutional_id)}<br><br><strong>Assinatura:</strong> ___________________________________________</div><canvas class="qr" id="qr${ix}"></canvas><table class="grid"><thead><tr><th>Q</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr></thead><tbody>${obj.map(i=>`<tr><th>${i.item_number}</th>${['A','B','C','D','E'].map(()=>`<td><span class="bubble"></span></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note">Preencha completamente um único círculo por questão. Não faça marcas fora da grade.</div><div class="sig">Código individual vinculado à avaliação e à matrícula. Uso exclusivo para correção automatizada.</div></section>`).join('');d.students.forEach((s,ix)=>QRCode.toCanvas(document.getElementById('qr'+ix),s.qr_payload,{width:120,margin:0,errorCorrectionLevel:'M'}));}catch(e){document.getElementById('pages').innerHTML='<p>Não foi possível gerar os gabaritos.</p>'}}load();</script></body></html>
