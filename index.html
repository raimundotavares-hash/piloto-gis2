<main class="c"><section id="login"><h1>Identificação</h1><label>Nome completo</label><input id="nome"><label>Matrícula</label><input id="mat"><label>E-mail</label><input id="email" type="email"><label>Confirmar e-mail</label><input id="email2" type="email"><button onclick="confirmar()">Continuar</button><div id="err" class="warn hide"></div></section>
<section id="confirm" class="hide"><h1>Confirme seus dados</h1><div id="summary"></div><button onclick="editar()">Editar</button> <button onclick="regras()">Confirmar dados</button></section>
<section id="rules" class="hide"><h1>Modo Prova Segura</h1><div class="warn"><b>Atenção:</b> após iniciar, sair da tela cheia, trocar de aba ou ocultar a prova encerra definitivamente a tentativa.</div><label><input style="width:auto" type="checkbox" id="ok"> Li e concordo com as regras.</label><br><button onclick="start()">Entrar em tela cheia e iniciar</button></section>
<section id="exam" class="hide"><div class="timer" id="timer">30:00</div><b id="who"></b><div class="nav" id="nav"></div><div id="q"></div><button onclick="prev()">Anterior</button> <button onclick="next()">Próxima</button><div id="sync" style="font-size:12px;color:#66706f;margin-top:12px"></div></section>

<script>
const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/gis2-pilot-api';
const bank=[{"id": 1, "source": "Enamed/Inep 2025, Caderno 1, questão 4 — matriz adaptada.", "text": "Uma secretaria municipal pretende avaliar um programa de prevenção da obesidade infantil. Doze Unidades Básicas de Saúde serão distribuídas aleatoriamente entre dois grupos. Nas unidades do primeiro grupo, crianças e familiares participarão de atividades educativas, orientação alimentar e práticas corporais. Nas demais, será mantido o acompanhamento habitual. Após 12 meses, serão comparadas a variação do índice de massa corporal e a frequência de atividade física. Para evitar que crianças atendidas na mesma unidade recebam intervenções diferentes, a randomização será realizada por UBS.\n\nQual é o delineamento empregado?", "options": ["Estudo transversal analítico.", "Estudo de caso-controle aninhado.", "Estudo ecológico de séries temporais.", "Ensaio comunitário randomizado por conglomerados.", "Coorte retrospectiva controlada."]}, {"id": 2, "source": "Enade Medicina 2023, questão 3 — matriz adaptada.", "text": "Pesquisadores analisaram, entre 2017 e 2025, a cobertura anual da vacina tríplice viral e as taxas de hospitalização por sarampo em 184 municípios. Os dados foram obtidos de sistemas públicos e organizados por município e ano. Não havia informações que permitissem relacionar a situação vacinal de cada criança com sua eventual hospitalização. Os pesquisadores observaram que municípios com maior queda da cobertura apresentaram aumento posterior das internações.\n\nEsse estudo é classificado como:", "options": ["Caso-controle de base populacional.", "Ecológico de séries temporais.", "Coorte prospectiva multicêntrica.", "Transversal com dados individuais.", "Ensaio comunitário não randomizado."]}, {"id": 3, "source": "Enade Medicina 2010, questão 39 — matriz adaptada.", "text": "No início de 2026, um distrito possuía 20.000 moradores sem diagnóstico prévio de dengue naquele ano. Durante os seis meses seguintes, foram confirmados 1.000 casos novos entre esses moradores. A equipe de vigilância deseja estimar a probabilidade de um indivíduo inicialmente sob risco desenvolver a doença durante o período. Para isso, pretende utilizar uma medida que considere apenas casos novos e a população sob risco no começo do acompanhamento.\n\nQual medida deve ser calculada?", "options": ["Incidência acumulada.", "Prevalência pontual.", "Mortalidade proporcional.", "Letalidade específica.", "Razão de prevalências."]}, {"id": 4, "source": "Residência Médica UNIRG 2019, prova tipo 4, questão 50 — matriz adaptada.", "text": "Um grupo de 2.400 adultos sem hipertensão arterial foi classificado, no início da pesquisa, de acordo com o consumo de alimentos ultraprocessados. Os participantes foram acompanhados anualmente durante cinco anos. Ao final, os pesquisadores compararam a incidência de hipertensão entre aqueles com alto consumo e aqueles com baixo consumo. As informações sobre alimentação foram coletadas antes do aparecimento do desfecho.\n\nQual é o delineamento do estudo?", "options": ["Estudo transversal.", "Caso-controle.", "Coorte prospectiva.", "Ensaio clínico cruzado.", "Estudo ecológico."]}, {"id": 5, "source": "Residência Médica UNIRG 2019, prova tipo 4, questão 49 — matriz adaptada.", "text": "Um estudo investigou a associação entre consumo frequente de carnes processadas e câncer colorretal. Foram incluídos 120 pacientes com câncer e 120 controles sem a doença. Entre os casos, 72 relataram consumo frequente; entre os controles, 48 apresentaram essa exposição.\n\nQual é a razão de chances — odds ratio — de exposição entre casos e controles?", "options": ["0,44.", "1,20.", "1,50.", "2,25.", "3,00."]}, {"id": 6, "source": "Residência Médica UNIRG/UFG 2017, prova tipo 2, questão 44 — matriz adaptada.", "text": "Uma coorte acompanhou trabalhadores sem diabetes durante oito anos. Entre 600 trabalhadores expostos regularmente ao trabalho noturno, 90 desenvolveram diabetes tipo 2. Entre 800 trabalhadores que exerciam apenas atividades diurnas, foram identificados 40 casos novos. Não houve perdas relevantes no acompanhamento.\n\nQual foi o risco relativo de diabetes associado ao trabalho noturno?", "options": ["1,5.", "3,0.", "4,0.", "5,0.", "7,5."]}, {"id": 7, "source": "Residência Médica UFRJ/IPPMG 2019, questão 89 — matriz adaptada.", "text": "Um pesquisador comparou 25 países e encontrou correlação positiva entre o consumo médio anual de fórmulas infantis e a mortalidade infantil. A partir desse resultado, concluiu que toda criança alimentada com fórmula possui maior risco de morrer do que uma criança amamentada. Entretanto, o banco utilizado continha apenas valores médios nacionais, sem informações individuais sobre alimentação, condições clínicas ou óbitos.\n\nQual é o principal problema dessa conclusão?", "options": ["Viés de memória.", "Viés de aferição diferencial.", "Falácia ecológica.", "Efeito Hawthorne.", "Regressão à média."]}, {"id": 8, "source": "Residência Médica UFRJ/IPPMG 2019, questão 94 — matriz adaptada.", "text": "Em um ensaio clínico, 400 pessoas com hipertensão foram alocadas aleatoriamente para receber um novo medicamento ou o tratamento habitual. A sequência de alocação foi produzida por computador e mantida sob sigilo até a inclusão de cada participante. Ao final de seis meses, os grupos foram comparados quanto ao controle pressórico e à ocorrência de eventos adversos.\n\nA principal finalidade da randomização é:", "options": ["Equilibrar fatores prognósticos conhecidos e desconhecidos, reduzindo confundimento.", "Impedir todas as perdas durante o acompanhamento.", "Garantir que participantes e pesquisadores permaneçam cegos.", "Aumentar automaticamente a validade externa do estudo.", "Eliminar erros aleatórios na medida da pressão arterial."]}, {"id": 9, "source": "Residência Médica SES-GO/UFG 2025, questão 58 — matriz adaptada.", "text": "Em um estudo transversal com estudantes de Medicina, a prevalência de sintomas depressivos foi comparada entre indivíduos sedentários e fisicamente ativos. A razão de prevalências foi 2,2, com intervalo de confiança de 95% entre 1,4 e 3,5.\n\nQual é a interpretação mais adequada?", "options": ["O sedentarismo elevou em 220% a incidência de depressão.", "A atividade física aumentou 2,2 vezes a prevalência do desfecho.", "Não existe associação estatística porque o intervalo é amplo.", "O estudo comprova que o sedentarismo causa depressão.", "A prevalência foi 2,2 vezes maior nos sedentários, com associação estatística, sem comprovação de temporalidade ou causalidade."]}, {"id": 10, "source": "Residência Médica FPP 2025, processo seletivo de 2024, questão 98 — matriz adaptada.", "text": "Uma coorte avaliou a ocorrência de infecção ocupacional entre profissionais de saúde. Como admissões, afastamentos e desligamentos ocorreram em diferentes momentos, o tempo de observação variou entre os participantes. Durante o estudo, foram registrados 18 casos novos e acumulados 270 pessoas-ano de acompanhamento.\n\nQual é a densidade de incidência?", "options": ["3,3 casos por 100 pessoas-ano.", "5,0 casos por 100 pessoas-ano.", "6,7 casos por 100 pessoas-ano.", "15,0 casos por 100 pessoas-ano.", "18,0 casos por 100 pessoas-ano."]}];
let display=[],i=0,ans={},armed=false,done=false,blocking=false,t=1800,attempt=null,startedAt=null;
const $=id=>document.getElementById(id); function show(id){['login','confirm','rules','exam','end'].forEach(x=>$(x).classList.add('hide'));$(id).classList.remove('hide')}
function error(m){$('err').textContent=m;$('err').classList.remove('hide')}
function confirmar(){let n=$('nome').value.trim(),m=$('mat').value.trim(),e=$('email').value.trim().toLowerCase(),e2=$('email2').value.trim().toLowerCase();if(n.length<5)return error('Informe o nome completo.');if(m.length<6)return error('Confira a matrícula.');if(!e||e!==e2)return error('Os e-mails precisam ser válidos e idênticos.');$('summary').innerHTML=`<p><b>Nome:</b> ${n}</p><p><b>Matrícula:</b> ${m}</p><p><b>E-mail:</b> ${e}</p><p><b>Turma:</b> GIS II - 4º semestre</p>`;show('confirm')}
function editar(){show('login')} function regras(){show('rules')}
async function call(x){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});let d=await r.json();if(!r.ok)throw Object.assign(new Error(d.error||'erro'),{data:d});return d}
async function start(){if(!$('ok').checked)return alert('Aceite as regras.');try{let d=await call({action:'start',name:$('nome').value,matricula:$('mat').value,email:$('email').value,turma:'GIS II - 4º semestre'});attempt=d.id;display=d.question_order.map(id=>bank.find(q=>q.id===id));startedAt=Date.now();await document.documentElement.requestFullscreen();$('who').textContent=$('nome').value+' • '+$('mat').value;show('exam');armed=true;render();timerLoop()}catch(e){show('end');$('endtitle').textContent='Não foi possível iniciar';$('msg').textContent=e.data?.error==='tentativa_existente'?'Esta matrícula já possui tentativa registrada.':'Erro ao iniciar a prova. Informe o professor.'}}
function render(){let q=display[i];$('nav').innerHTML='';display.forEach((x,n)=>{let b=document.createElement('button');b.textContent=n+1;if(ans[x.id])b.style.background='#f47c20';b.onclick=()=>{i=n;render()};$('nav').appendChild(b)});$('q').innerHTML=`<h2>Questão ${i+1} de 10</h2><div class="source"><span>Questão-fonte</span>${q.source}</div><div class="qtext">${q.text}</div>${q.options.map((x,n)=>`<label class="opt"><input type="radio" name="a" ${ans[q.id]===String.fromCharCode(65+n)?'checked':''} onchange="save(${q.id},'${String.fromCharCode(65+n)}')"> <b>${String.fromCharCode(65+n)})</b> ${x}</label>`).join('')}`}
async function save(q,a){ans[q]=a;$('sync').textContent='Salvando...';try{await call({action:'save',attempt_id:attempt,question_id:q,answer:a});$('sync').textContent='Resposta salva no banco central.'}catch(e){$('sync').textContent='Falha de sincronização.'}render()}
function prev(){if(i>0){i--;render()}} function next(){if(i<display.length-1){i++;render()}else if(confirm('Finalizar definitivamente?'))finish()}
async function finish(){done=true;armed=false;try{await call({action:'finish',attempt_id:attempt,duration_seconds:Math.floor((Date.now()-startedAt)/1000)});$('endtitle').textContent='Simulado enviado com sucesso';$('msg').textContent='Suas respostas foram registradas.'}catch(e){$('msg').textContent='Houve falha ao confirmar a finalização. Informe o professor.'}show('end');if(document.fullscreenElement)document.exitFullscreen()}
async function block(type){if(!armed||done||blocking)return;blocking=true;armed=false;try{await call({action:'block',attempt_id:attempt,event_type:type,detail:'Evento detectado pelo Modo Prova Segura',question_id:display[i].id})}catch(e){}$('endtitle').textContent='Tentativa bloqueada';$('msg').textContent='Foi detectada saída do ambiente seguro. A matrícula não poderá reiniciar esta prova.';show('end')}
document.addEventListener('fullscreenchange',()=>{if(armed&&!document.fullscreenElement)block('fullscreen_exit')});document.addEventListener('visibilitychange',()=>{if(armed&&document.hidden)block('visibility_hidden')});window.addEventListener('blur',()=>{if(armed)setTimeout(()=>{if(armed&&!document.hasFocus())block('window_blur')},300)});document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('paste',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
function timerLoop(){setInterval(()=>{if(!armed)return;t--;$('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t<=0)finish()},1000)}
</script></body></html>
