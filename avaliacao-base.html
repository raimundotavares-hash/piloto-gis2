<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Avaliação pela Base da Disciplina</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}input,select{width:100%;padding:11px;border:1px solid #bdcbc8;border-radius:9px;font:inherit}.btn,button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.list{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px}.item{display:flex;gap:8px;align-items:flex-start;padding:8px;border-bottom:1px solid #edf1f0}.item input{width:auto;margin-top:3px}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}</style></head><body><header><strong style="color:#00685f;font-size:21px">IDOMED • Nova avaliação</strong><a class="btn light" href="professor-area.html">Área do Professor</a></header><div class="wrap"><div class="card"><h1 id="title">Base da Disciplina</h1><p class="muted">Os dados curriculares cadastrados aparecem automaticamente. Marque somente o que deverá compor esta avaliação.</p></div><div class="card"><h2>Turma e configuração</h2><div class="grid2"><div><label>Turma</label><select id="classSelect"><option>Carregando...</option></select></div><div><label>Título</label><input id="assessmentTitle" placeholder="Ex.: AV1 — Estudos epidemiológicos"></div></div><div class="grid3"><div><label>Tipo</label><select id="assessmentType" onchange="syncTotal()"><option>AV1</option><option>AV2</option><option>PR1</option><option>PR2</option><option>SIMULADO</option><option>OUTRA</option></select></div><div><label>Valor total</label><input id="totalPoints" type="number" step="0.1" value="9"></div><div><label>Composição</label><div class="grid2"><input id="objectiveCount" type="number" value="8" min="0" title="Objetivas"><input id="discursiveCount" type="number" value="2" min="0" title="Discursivas"></div></div></div></div><div class="grid3"><div class="card"><div class="actions"><h2 style="margin-right:auto">Conteúdos</h2><button class="light" onclick="toggle('content',true)">Todos</button><button class="light" onclick="toggle('content',false)">Nenhum</button></div><div id="contents" class="list"></div></div><div class="card"><div class="actions"><h2 style="margin-right:auto">Objetivos</h2><button class="light" onclick="toggle('objective',true)">Todos</button><button class="light" onclick="toggle('objective',false)">Nenhum</button></div><div id="objectives" class="list"></div></div><div class="card"><div class="actions"><h2 style="margin-right:auto">Referências</h2><button class="light" onclick="toggle('reference',true)">Todas</button><button class="light" onclick="toggle('reference',false)">Nenhuma</button></div><div id="references" class="list"></div></div></div><div class="card"><button class="primary" onclick="createAssessment()">Criar avaliação e gerar blueprint</button><div id="msg"></div></div></div><script>const PROF='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-professor',CURR='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-curriculum',token=sessionStorage.getItem('platform_access_token'),COURSE_ID=new URLSearchParams(location.search).get('course_id')||'', $=x=>document.getElementById(x);if(!token||!COURSE_ID)location.href='professor-area.html';async function call(url,b){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function syncTotal(){if($('assessmentType').value==='AV1')$('totalPoints').value=9;if($('assessmentType').value==='AV2')$('totalPoints').value=8}function renderList(id,type,rows){$(id).innerHTML=rows.length?rows.map((r,i)=>`<label class="item"><input type="checkbox" data-type="${type}" value="${esc(r.item_text)}" checked><span>${esc(r.item_text)}</span></label>`).join(''):'<div class="muted">Nenhum item cadastrado.</div>'}function toggle(type,v){document.querySelectorAll(`input[data-type="${type}"]`).forEach(x=>x.checked=v)}function selected(type){return [...document.querySelectorAll(`input[data-type="${type}"]:checked`)].map(x=>x.value)}async function init(){try{const [home,cur,classes]=await Promise.all([call(PROF,{action:'home'}),call(CURR,{action:'get',course_id:COURSE_ID}),call(PROF,{action:'list_classes',course_id:COURSE_ID})]);const course=(home.courses||[]).find(x=>x.id===COURSE_ID);$('title').textContent=(course?.code?course.code+' • ':'')+(course?.name||'Base da Disciplina');$('classSelect').innerHTML='<option value="">Selecione a turma</option>'+(classes.classes||[]).map(c=>`<option value="${c.id}">${esc(c.name)}${c.term?' — '+esc(c.term):''}</option>`).join('');renderList('contents','content',cur.contents||[]);renderList('objectives','objective',cur.objectives||[]);renderList('references','reference',cur.references||[])}catch(e){$('msg').innerHTML='<div class="notice">Não foi possível carregar a Base da Disciplina.</div>'}}async function createAssessment(){const class_id=$('classSelect').value,title=$('assessmentTitle').value.trim(),contents=selected('content'),objectives=selected('objective'),refs=selected('reference');if(!class_id||!title||!contents.length||!objectives.length){$('msg').innerHTML='<div class="notice">Selecione turma, informe o título e mantenha pelo menos um conteúdo e um objetivo.</div>';return}try{const d=await call(PROF,{action:'create_assessment',course_id:COURSE_ID,class_id,title,assessment_type:$('assessmentType').value,total_points:Number($('totalPoints').value),objective_count:Number($('objectiveCount').value),discursive_count:Number($('discursiveCount').value),contents,objectives,references:refs});location.href='prova-fluxo.html?assessment_id='+encodeURIComponent(d.assessment.id)}catch(e){$('msg').innerHTML='<div class="notice">Não foi possível criar a avaliação: '+esc(e.message)+'</div>'}}init();</script></body></html>
