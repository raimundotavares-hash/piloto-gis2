<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDOMED • Artefatos da Avaliação</title>
<style>
:root{--p:#005b55;--o:#f47c20;--bg:#f3f7f6;--line:#d8e4e2;--muted:#657270;--ok:#2e7d32;--danger:#b3261e}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:var(--p);font-size:21px;font-weight:900}.container{max-width:1100px;margin:28px auto;padding:0 16px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 8px 28px #0000000d}h1,h2{color:var(--p)}.muted{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.artifact{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}.artifact h3{margin:0 0 8px;color:var(--p)}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#edf5f3;color:var(--p)}.status.ready{background:#edf7f4;color:var(--ok)}.status.pending{background:#fff5eb;color:#a65c00}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn,button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.secondary{background:#edf5f3;color:var(--p)}button:disabled{opacity:.45;cursor:not-allowed}.notice,.error{border-radius:9px;padding:14px;margin:14px 0}.notice{background:#fff5eb;border-left:5px solid var(--o)}.error{background:#fff0ee;border-left:5px solid var(--danger)}.login{max-width:520px;margin:50px auto}.login input{width:100%;padding:11px;border:1px solid #bcc9c6;border-radius:9px;margin:6px 0 12px}.filename{font-size:12px;color:var(--muted);word-break:break-all}@media(max-width:720px){header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand">IDOMED • Documentos da Avaliação</div><div><a id="back" class="btn secondary" href="professor-area.html">Voltar ao fluxo</a></div></header>
<div class="container"><div id="app"></div></div>
<script>
const WORKFLOW_API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-assessment-workflow';
const AUTH_API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-auth';
const ASSESSMENT_ID=new URLSearchParams(location.search).get('assessment_id')||'';
const app=document.getElementById('app');
if(!ASSESSMENT_ID){app.innerHTML='<div class="error">Avaliação não informada na URL.</div>';throw new Error('assessment_id ausente')}
document.getElementById('back').href='prova-fluxo.html?assessment_id='+encodeURIComponent(ASSESSMENT_ID);
function token(){return sessionStorage.getItem('platform_access_token')||''}
function role(){return sessionStorage.getItem('platform_role')||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function post(url,body,auth=true){const headers={'Content-Type':'application/json'};if(auth)headers.Authorization='Bearer '+token();const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.error||d.message||'Falha na solicitação'),{data:d,status:r.status});return d}
function showLogin(msg='Sua sessão não está ativa nesta aba. Entre como professor para continuar.'){
 app.innerHTML=`<div class="card login"><h1>Acessar documentos</h1><p class="muted">${esc(msg)}</p><label>Matrícula</label><input id="mat" autocomplete="username"><label>Senha</label><input id="pwd" type="password" autocomplete="current-password"><button class="primary" onclick="login()">Entrar como professor</button><div id="loginMsg"></div></div>`;
}
async function login(){const mat=document.getElementById('mat').value.trim(),pwd=document.getElementById('pwd').value;const box=document.getElementById('loginMsg');if(!mat||!pwd){box.innerHTML='<div class="error">Informe matrícula e senha.</div>';return}try{const d=await post(AUTH_API,{action:'login',institutional_id:mat,password:pwd,role:'professor'},false);sessionStorage.setItem('platform_access_token',d.session.access_token);sessionStorage.setItem('platform_refresh_token',d.session.refresh_token||'');sessionStorage.setItem('platform_role','professor');await load();}catch(e){box.innerHTML='<div class="error">Não foi possível entrar: '+esc(e.message)+'</div>'}}
const labels={BLUEPRINT_REPORT:'Relatório do Blueprint',COMMENTED_KEY:'Gabarito Comentado',EXAM_TEMPLATE:'Prova do Aluno',OMR_PACKAGE:'Pacote OMR / Gabaritos',TECHNICAL_DOSSIER:'Dossiê Técnico'};
function previewArtifact(i){const a=window.__artifacts[i],html=a?.metadata?.content_html;if(!html)return alert('Este artefato ainda não possui conteúdo visualizável.');const w=window.open('','_blank');if(!w)return alert('O navegador bloqueou a nova janela. Permita pop-ups para visualizar.');w.document.open();w.document.write(html);w.document.close();}
function downloadArtifact(i){const a=window.__artifacts[i],html=a?.metadata?.content_html;if(!html)return alert('Este artefato ainda não possui conteúdo para download.');const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=a.metadata?.filename||((a.artifact_type||'documento').toLowerCase()+'.html');document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(data){const a=data.assessment,arts=data.package||[];window.__artifacts=arts;app.innerHTML=`<div class="card"><h1>${esc(a.title||'Avaliação')}</h1><p class="muted">Pacote técnico pré-aplicação. Visualize cada documento antes de baixar.</p></div><div class="grid">${arts.map((x,i)=>{const ready=x.status==='ready',has=!!x.metadata?.content_html,reason=x.metadata?.reason||'';return `<div class="artifact"><h3>${esc(labels[x.artifact_type]||x.artifact_type)}</h3><span class="status ${esc(x.status)}">${esc(x.status)}</span>${x.metadata?.filename?`<div class="filename">${esc(x.metadata.filename)}</div>`:''}${reason?`<div class="notice">${esc(reason)}</div>`:''}<div class="actions"><button class="secondary" onclick="previewArtifact(${i})" ${ready&&has?'':'disabled'}>Visualizar</button><button class="primary" onclick="downloadArtifact(${i})" ${ready&&has?'':'disabled'}>Baixar HTML</button></div></div>`}).join('')}</div>`}
async function load(){if(!token()||role()!=='professor'){showLogin();return}try{const d=await post(WORKFLOW_API,{action:'get_assessment',assessment_id:ASSESSMENT_ID});render(d)}catch(e){if(e.status===401||e.status===403){showLogin('A sessão expirou. Entre novamente para acessar os documentos.')}else app.innerHTML='<div class="error">Erro ao carregar artefatos: '+esc(e.message)+'</div>'}}
load();
</script>
</body>
</html>
