<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Inteligência Avaliativa</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--p);font-size:21px}.container{max-width:1360px;margin:24px auto;padding:0 16px 50px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0000000c}.card{padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.btn,button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.stat{padding:15px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:24px;color:var(--p);margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th{background:var(--p);color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid var(--line)}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#edf5f3;color:var(--p)}.flag{background:#fff3e0;color:#955700}.bad{background:#fff0ed;color:var(--danger)}.bar{height:10px;background:#e7efed;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--p)}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px}.metricRow{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="brand">IDOMED • Inteligência Avaliativa</div><div><a id="back" class="btn light" href="professor-area.html">← Voltar</a> <button class="light" onclick="logout()">Sair</button></div></header><div class="container"><div class="card"><div class="top"><div><h1 id="title">Carregando...</h1><div id="meta" class="muted"></div></div><button id="calc" class="primary" onclick="compute()">Recalcular análise</button></div></div><div id="warning"></div><div class="stats"><div class="stat"><span>Finalizados</span><b id="n">—</b></div><div class="stat"><span>Média</span><b id="mean">—</b></div><div class="stat"><span>Mediana</span><b id="median">—</b></div><div class="stat"><span>Desvio-padrão</span><b id="sd">—</b></div><div class="stat"><span>KR-20</span><b id="kr">—</b></div><div class="stat"><span>Média %</span><b id="meanp">—</b></div></div><div class="card"><h2>Análise por questão</h2><div id="items" class="scroll"></div></div><div class="grid2"><div class="card"><h2>Desempenho por conteúdo</h2><div id="content"></div></div><div class="card"><h2>Desempenho por Bloom</h2><div id="bloom"></div></div></div><div class="card"><h2>Objetivos de aprendizagem</h2><div id="objectives"></div></div></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-analytics',token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role'),$=id=>document.getElementById(id),AID=new URLSearchParams(location.search).get('assessment_id')||'';if(!token||role!=='professor')location.href='plataforma.html';if(!AID)location.href='professor-area.html';async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}function f(v,d=2){return v==null?'—':Number(v).toFixed(d)}function pct(v){return v==null?'—':(Number(v)*100).toFixed(1)+'%'}function flags(a){return (a||[]).map(x=>`<span class="badge ${x==='discriminacao_negativa'?'bad':'flag'}">${x.replaceAll('_',' ')}</span>`).join(' ')}function metricBlock(obj){const e=Object.entries(obj||{});return e.length?e.sort((a,b)=>Number(b[1].percent||0)-Number(a[1].percent||0)).map(([k,v])=>`<div class="metricRow"><div class="top"><strong>${k}</strong><span>${f(v.percent,1)}%</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(v.percent||0)))}%"></span></div></div>`).join(''):'<p class="muted">Sem dados suficientes.</p>'}function render(d){const a=d.analytics;$('title').textContent=d.assessment.title;$('meta').textContent=(d.assessment.assessment_type||'Avaliação')+' • '+d.assessment.total_points+' pontos';if(d.assessment.class_id)$('back').href='correcao.html?assessment_id='+encodeURIComponent(AID);if(!a){$('warning').innerHTML='<div class="notice">Ainda não há análise calculada. Finalize correções e clique em “Recalcular análise”.</div>';return}$('warning').innerHTML=(a.flags||[]).length?'<div class="notice">Alertas gerais: '+flags(a.flags)+'</div>':'';$('n').textContent=a.n_completed??0;$('mean').textContent=f(a.mean_score);$('median').textContent=f(a.median_score);$('sd').textContent=f(a.stddev_score);$('kr').textContent=f(a.reliability_kr20,3);$('meanp').textContent=f(a.mean_percent,1)+'%';$('items').innerHTML=d.items.length?`<table><thead><tr><th>Q</th><th>Conteúdo</th><th>Facilidade</th><th>Dificuldade</th><th>Discriminação</th><th>Brancos</th><th>Alertas</th></tr></thead><tbody>${d.items.map(i=>`<tr><td><strong>${i.item_number}</strong></td><td>${i.content_area||'—'}</td><td>${pct(i.facility)}</td><td>${i.difficulty_label||'—'}</td><td>${f(i.discrimination,3)}</td><td>${pct(i.blank_rate)}</td><td>${flags(i.flags)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Sem itens analisados.</p>';$('content').innerHTML=metricBlock(a.content_stats);$('bloom').innerHTML=metricBlock(a.bloom_stats);$('objectives').innerHTML=metricBlock(a.objective_stats)}async function load(){try{render(await call({action:'get',assessment_id:AID}))}catch(e){$('warning').innerHTML='<div class="notice">Não foi possível carregar a análise.</div>'}}async function compute(){const b=$('calc');b.disabled=true;b.textContent='Calculando...';try{render(await call({action:'compute',assessment_id:AID}))}catch(e){$('warning').innerHTML='<div class="notice">Falha no cálculo: '+e.message+'</div>'}finally{b.disabled=false;b.textContent='Recalcular análise'}}load();</script></body></html>
