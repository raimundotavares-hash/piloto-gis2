<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Correção e Resultados</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573;--danger:#b3261e;--ok:#2e7d32}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;color:var(--p);font-size:21px}.container{max-width:1320px;margin:24px auto;padding:0 16px 50px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0000000c}.card{padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.btn,button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.danger{background:#fff0ed;color:var(--danger);border:1px solid #f0c6bf}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:25px;color:var(--p);margin-top:5px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th{background:var(--p);color:#fff;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid var(--line)}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.b-ok{background:#edf7ee;color:var(--ok)}.b-pend{background:#fff5eb;color:#9b5800}.b-abs{background:#fff0ed;color:var(--danger)}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:min(1050px,100%);border-radius:16px;padding:22px;box-shadow:0 20px 60px #0004}.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.item-grid{display:grid;grid-template-columns:120px 1fr 130px;gap:10px;align-items:start}.item input,.item textarea,.item select{width:100%;padding:9px;border:1px solid #bdcbc8;border-radius:8px;font:inherit}.item textarea{min-height:70px}.stem{font-size:13px;color:#33413f;margin:6px 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.right{text-align:right}.score{font-weight:900;color:var(--p)}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.item-grid{grid-template-columns:1fr}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><header><div class="brand">IDOMED • Correção e Resultados</div><div><a id="back" class="btn light" href="professor-area.html">← Voltar</a> <button class="light" onclick="logout()">Sair</button></div></header><div class="container"><div class="card"><div class="top"><div><h1 id="title">Carregando avaliação...</h1><div id="meta" class="muted"></div></div><a class="btn light" id="openAssessment" href="#">Abrir avaliação</a></div></div><div class="stats"><div class="stat"><span>Alunos</span><b id="sStudents">–</b></div><div class="stat"><span>Finalizados</span><b id="sDone">–</b></div><div class="stat"><span>Pendentes</span><b id="sPending">–</b></div><div class="stat"><span>Ausentes</span><b id="sAbsent">–</b></div></div><div id="warning"></div><div class="card"><h2>Correção da turma</h2><p class="muted">Itens objetivos são corrigidos automaticamente pelo gabarito. Questões discursivas ficam pendentes até receberem pontuação manual.</p><div id="roster" class="scroll"></div></div></div><div id="modal" class="modal"><div class="sheet"><div class="top"><div><h2 id="studentName">Aluno</h2><div id="studentId" class="muted"></div></div><button class="light" onclick="closeModal()">Fechar</button></div><div id="items"></div><div class="actions"><button class="primary" onclick="saveCorrection()">Salvar correção</button><button class="danger" onclick="markAbsentCurrent()">Marcar ausente</button></div><div id="saveMsg" style="margin-top:10px"></div></div></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-correction',token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role'),$=id=>document.getElementById(id),ASSESSMENT_ID=new URLSearchParams(location.search).get('assessment_id')||'';let DATA=null,CURRENT=null;if(!token||role!=='professor')location.href='plataforma.html';if(!ASSESSMENT_ID)location.href='professor-area.html';async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}function resultFor(id){return (DATA.results||[]).find(r=>r.student_id===id)}function responsesFor(id){return (DATA.responses||[]).filter(r=>r.student_id===id)}function badge(r){if(!r)return '<span class="badge b-pend">Não corrigido</span>';if(r.status==='absent')return '<span class="badge b-abs">Ausente</span>';if(Number(r.pending_manual_items||0)>0)return '<span class="badge b-pend">Pendente</span>';return '<span class="badge b-ok">Finalizado</span>'}function render(){const students=DATA.students||[],done=students.filter(s=>resultFor(s.id)?.status==='completed').length,abs=students.filter(s=>resultFor(s.id)?.status==='absent').length,pending=students.length-done-abs;$('sStudents').textContent=students.length;$('sDone').textContent=done;$('sPending').textContent=pending;$('sAbsent').textContent=abs;$('title').textContent=DATA.assessment.title;$('meta').textContent=(DATA.assessment.assessment_type||'Avaliação')+' • '+DATA.assessment.total_points+' pontos • '+DATA.items.length+' questão(ões)';$('openAssessment').href='prova-fluxo.html?assessment_id='+encodeURIComponent(ASSESSMENT_ID);if(!DATA.items.length){$('warning').innerHTML='<div class="notice">Esta avaliação ainda não possui itens gravados no banco. A correção será liberada quando a etapa de geração dos itens for concluída.</div>'}else $('warning').innerHTML='';$('roster').innerHTML=students.length?`<table><thead><tr><th>Matrícula</th><th>Aluno</th><th>Status</th><th>Nota</th><th>Desempenho</th><th></th></tr></thead><tbody>${students.map(s=>{const r=resultFor(s.id);return `<tr><td>${s.institutional_id}</td><td><strong>${s.full_name}</strong></td><td>${badge(r)}</td><td class="score">${r?.score==null?'—':Number(r.score).toFixed(2)} / ${r?.max_score==null?Number(DATA.assessment.total_points).toFixed(2):Number(r.max_score).toFixed(2)}</td><td>${r?.percent==null?'—':Number(r.percent).toFixed(1)+'%'}</td><td><button class="light" ${DATA.items.length?'':'disabled'} onclick='openStudent(${JSON.stringify(s.id)})'>Corrigir</button></td></tr>`}).join('')}</tbody></table>`:'<div class="notice">Nenhum aluno cadastrado nesta turma.</div>'}function isDisc(i){return String(i.item_type||'').toLowerCase().includes('disc')||String(i.item_format||'').toUpperCase()==='DISCURSIVA'}function openStudent(id){CURRENT=(DATA.students||[]).find(s=>s.id===id);if(!CURRENT)return;const rs=responsesFor(id);$('studentName').textContent=CURRENT.full_name;$('studentId').textContent='Matrícula: '+CURRENT.institutional_id;$('items').innerHTML=(DATA.items||[]).map(i=>{const r=rs.find(x=>Number(x.item_number)===Number(i.item_number))||{};const disc=isDisc(i),ann=r.correction_status==='annulled';return `<div class="item" data-item="${i.item_number}"><div class="top"><strong>Questão ${i.item_number} • ${i.item_format||i.item_type}</strong><span>Valor: ${Number(i.max_points).toFixed(2)}</span></div>${i.stem?`<div class="stem">${i.stem}</div>`:''}<div class="item-grid"><div><label>Status</label><select class="status"><option value="answered" ${r.correction_status==='answered'?'selected':''}>Respondida</option><option value="blank" ${r.correction_status==='blank'?'selected':''}>Em branco</option><option value="annulled" ${ann?'selected':''}>Anulada</option></select></div><div><label>Resposta do aluno</label><textarea class="response">${r.response_text||''}</textarea>${!disc&&i.correct_answer?`<div class="muted">Gabarito: <strong>${i.correct_answer}</strong></div>`:''}${disc&&i.rubric?`<div class="muted">Rubrica: ${i.rubric}</div>`:''}</div><div><label>Pontuação</label><input class="points" type="number" min="0" max="${i.max_points}" step="0.01" value="${r.awarded_points??''}" ${disc?'':'readonly'}><label style="display:block;margin-top:8px">Feedback</label><textarea class="feedback" style="min-height:52px">${r.teacher_feedback||''}</textarea></div></div></div>`}).join('');$('saveMsg').innerHTML='';$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open');CURRENT=null}async function saveCorrection(){if(!CURRENT)return;const responses=[...document.querySelectorAll('.item')].map(el=>({item_number:Number(el.dataset.item),correction_status:el.querySelector('.status').value,response_text:el.querySelector('.response').value,awarded_points:el.querySelector('.points').value,teacher_feedback:el.querySelector('.feedback').value}));$('saveMsg').innerHTML='<div class="notice">Salvando...</div>';try{const d=await call({action:'save_student',assessment_id:ASSESSMENT_ID,student_id:CURRENT.id,responses});$('saveMsg').innerHTML=d.pending?`<div class="notice">Correção salva. Ainda há ${d.pending_manual_items} item(ns) discursivo(s) pendente(s).</div>`:'<div class="notice">Correção finalizada e nota consolidada.</div>';await load();if(!d.pending)setTimeout(closeModal,700)}catch(e){$('saveMsg').innerHTML='<div class="notice">Não foi possível salvar: '+e.message+'</div>'}}async function markAbsentCurrent(){if(!CURRENT||!confirm('Marcar '+CURRENT.full_name+' como ausente nesta avaliação?'))return;try{await call({action:'mark_absent',assessment_id:ASSESSMENT_ID,student_id:CURRENT.id});await load();closeModal()}catch(e){alert('Não foi possível marcar ausência.')}}async function load(){try{DATA=await call({action:'assessment_roster',assessment_id:ASSESSMENT_ID});if(DATA.assessment.class_id)$('back').href='turma-painel.html?class_id='+encodeURIComponent(DATA.assessment.class_id);render()}catch(e){document.querySelector('.container').innerHTML='<div class="notice">Não foi possível carregar a correção desta avaliação.</div>'}}load();</script></body></html>
