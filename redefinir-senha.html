<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Redefinir senha</title><style>:root{--p:#005b55;--o:#f47c20;--bg:#f3f7f6;--line:#d7e4e1;--muted:#64716f}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}.wrap{max-width:650px;margin:0 auto;padding:60px 18px}.brand{text-align:center;margin-bottom:24px}.brand h1{color:var(--p)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 30px #00000012}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #bcc9c6;border-radius:10px;font-size:15px}button,a{border:0;border-radius:10px;padding:11px 15px;font-weight:800;text-decoration:none;display:inline-block;cursor:pointer}.btn{background:var(--p);color:#fff}.back{background:#edf5f3;color:var(--p);margin-left:7px}.notice{background:#fff4e9;border-left:5px solid var(--o);padding:12px;border-radius:8px;margin-top:14px}.ok{background:#edf8f5;border-left-color:var(--p)}.muted{color:var(--muted);line-height:1.5}</style></head><body><div class="wrap"><div class="brand"><h1>IDOMED • Gestão Avaliativa</h1></div><div class="card"><h2 style="color:#005b55">Redefinir senha</h2><p class="muted">Abra esta página pelo link recebido no seu e-mail. Depois escolha uma nova senha para continuar usando sua matrícula normalmente.</p><div id="form"><label>Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="8"><label>Confirmar nova senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="8"><div style="margin-top:16px"><button id="save" class="btn" onclick="savePassword()">Salvar nova senha</button><a class="back" href="plataforma.html?role=professor">Voltar ao login</a></div></div><div id="msg" class="notice" style="display:none"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const URL='https://lvdzsqqimxbhxezaiwlr.supabase.co',KEY='sb_publishable_cc-eXZV-As7-h6wny9Y3Bw_kg6chf8S',supabase=createClient(URL,KEY,{auth:{detectSessionInUrl:true,persistSession:false}}),$=id=>document.getElementById(id);function show(t,ok=false){$('msg').textContent=t;$('msg').style.display='block';$('msg').classList.toggle('ok',ok)}async function prepare(){try{const code=new URLSearchParams(location.search).get('code');if(code){const{error}=await supabase.auth.exchangeCodeForSession(code);if(error)throw error}const{data}=await supabase.auth.getSession();if(!data.session)show('O link de redefinição é inválido ou expirou. Solicite um novo link na tela de login.')}catch(e){show('O link de redefinição é inválido ou expirou. Solicite um novo link na tela de login.')}}window.savePassword=async function(){const p=$('password').value,c=$('confirm').value;if(p.length<8){show('A nova senha deve ter pelo menos 8 caracteres.');return}if(p!==c){show('As duas senhas não coincidem.');return}const b=$('save');b.disabled=true;b.textContent='Salvando...';try{const{error}=await supabase.auth.updateUser({password:p});if(error)throw error;show('Senha atualizada com sucesso. Você já pode voltar ao login e entrar com sua matrícula.',true);$('form').querySelectorAll('input').forEach(x=>x.disabled=true)}catch(e){show('Não foi possível atualizar a senha. Solicite um novo link e tente novamente.')}finally{b.disabled=false;b.textContent='Salvar nova senha'}};prepare();</script></body></html>
