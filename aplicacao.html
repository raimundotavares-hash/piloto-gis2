<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Aplicação da Avaliação</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}.wrap{max-width:920px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #0000000c}h1,h2{color:var(--p)}input,textarea{width:100%;padding:12px;border:1px solid #bdcbc8;border-radius:9px;font:inherit}textarea{min-height:140px}.btn,button{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.muted{color:var(--muted)}.timer{position:sticky;top:0;background:var(--p);color:#fff;padding:12px 18px;border-radius:0 0 14px 14px;font-weight:900;text-align:center;z-index:5}.q{margin:16px 0;padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.opt{display:block;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px}.hidden{display:none}.saved{font-size:12px;color:var(--p);font-weight:800}</style></head><body><div id="timer" class="timer hidden">Tempo restante: --:--</div><div class="wrap"><div id="entry" class="card"><h1>Aplicação da avaliação</h1><div id="sessionInfo" class="muted">Validando sessão...</div><div style="margin-top:14px"><label>Matrícula</label><input id="matricula" inputmode="numeric" placeholder="Digite sua matrícula"></div><div style="margin-top:14px"><button class="primary" onclick="startExam()">Iniciar avaliação</button></div><div id="entryMsg" style="margin-top:12px"></div></div><div id="exam" class="hidden"><div class="card"><h1 id="title"></h1><div id="student" class="muted"></div><div class="notice">Responda com atenção. Suas respostas são salvas automaticamente. Ao terminar, clique em <strong>Finalizar avaliação</strong>.</div></div><div id="items"></div><div class="card"><button class="primary" onclick="finishExam()">Finalizar avaliação</button><div id="finishMsg" style="margin-top:10px"></div></div></div><div id="done" class="card hidden"><h2>Avaliação finalizada</h2><p>Suas respostas foram registradas. Você já pode fechar esta página.</p></div></div><script>const API='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-application',q=new URLSearchParams(location.search),TOKEN=q.get('sessao')||'';let ATTEMPT=null,DEADLINE=0,TICK=null;async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}async function init(){if(!TOKEN){document.getElementById('sessionInfo').innerHTML='<div class="notice">Link de sessão ausente.</div>';return}try{const d=await call({action:'session_status',session_token:TOKEN});document.getElementById('sessionInfo').textContent=`${d.assessment.title} • ${d.class.name} • ${Math.round(d.exam_duration_seconds/60)} minutos`;}catch(e){document.getElementById('sessionInfo').innerHTML='<div class="notice">Esta sessão não está mais disponível.</div>'}}async function startExam(){const m=document.getElementById('matricula').value.trim();try{const d=await call({action:'start',session_token:TOKEN,matricula:m});ATTEMPT=d.attempt;DEADLINE=Date.parse(ATTEMPT.deadline_at);document.getElementById('entry').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');document.getElementById('timer').classList.remove('hidden');document.getElementById('title').textContent=d.assessment.title;document.getElementById('student').textContent=d.student.full_name+' • Matrícula '+d.student.institutional_id;document.getElementById('items').innerHTML=d.items.map(i=>renderItem(i)).join('');tick();TICK=setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&ATTEMPT)call({action:'security_event',attempt_id:ATTEMPT.id,event_type:'page_hidden',detail:'A aba perdeu visibilidade'}).catch(()=>{})})}catch(e){document.getElementById('entryMsg').innerHTML='<div class="notice">Não foi possível iniciar: '+esc(e.message)+'</div>'}}function renderItem(i){const isDisc=String(i.item_type||'').toLowerCase().includes('disc')||String(i.item_format||'').toUpperCase()==='DISCURSIVA';let body=`<div class="q" data-q="${i.item_number}"><h2>Questão ${i.item_number}</h2><p>${esc(i.stem)}</p>`;if(isDisc)body+=`<textarea onblur="saveAnswer(${i.item_number},this.value)" placeholder="Digite sua resposta"></textarea>`;else{const opts=Array.isArray(i.options)?i.options:[];body+=opts.map((o,k)=>`<label class="opt"><input type="radio" name="q${i.item_number}" value="${String.fromCharCode(65+k)}" onchange="saveAnswer(${i.item_number},this.value)"> <strong>${String.fromCharCode(65+k)})</strong> ${esc(typeof o==='string'?o:(o.text||o.label||o.value||''))}</label>`).join('')}body+=`<div id="save${i.item_number}" class="saved"></div></div>`;return body}async function saveAnswer(n,v){if(!ATTEMPT)return;document.getElementById('save'+n).textContent='Salvando...';try{await call({action:'save',attempt_id:ATTEMPT.id,item_number:n,answer_text:v});document.getElementById('save'+n).textContent='Resposta salva'}catch(e){document.getElementById('save'+n).textContent='Falha ao salvar'}}function tick(){const s=Math.floor((DEADLINE-Date.now())/1000);document.getElementById('timer').textContent='Tempo restante: '+fmt(s);if(s<=0){clearInterval(TICK);finishExam(true)}}async function finishExam(auto=false){if(!ATTEMPT)return;if(!auto&&!confirm('Finalizar a avaliação? Após finalizar, não será possível alterar as respostas.'))return;try{await call({action:'finish',attempt_id:ATTEMPT.id});clearInterval(TICK);document.getElementById('exam').classList.add('hidden');document.getElementById('timer').classList.add('hidden');document.getElementById('done').classList.remove('hidden')}catch(e){document.getElementById('finishMsg').innerHTML='<div class="notice">Não foi possível finalizar: '+esc(e.message)+'</div>'}}init();</script></body></html>
