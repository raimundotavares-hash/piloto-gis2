<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOMED • Painel da Disciplina</title><style>:root{--p:#00685f;--o:#f47c20;--bg:#f2f7f6;--line:#d7e5e2;--muted:#667573}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#17201f}header{background:#fff;border-bottom:5px solid var(--p);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;color:var(--p)}.container{max-width:1280px;margin:24px auto;padding:0 16px 50px}.card,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0000000c}.card{padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1,h2,h3{color:var(--p)}.muted{color:var(--muted)}.btn,button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:var(--p);color:#fff}.light{background:#edf5f3;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:24px;color:var(--p);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.class-card{border-left:6px solid var(--p)}.badge{display:inline-block;background:#edf5f3;color:var(--p);font-weight:800;font-size:11px;border-radius:999px;padding:5px 8px}.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.mini div{background:#f8fbfa;border-radius:10px;padding:10px}.mini b{display:block;color:var(--p);font-size:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;padding:11px;border:1px solid #bdcbc8;border-radius:9px;font:inherit}.notice{background:#fff5eb;border-left:5px solid var(--o);padding:12px;border-radius:9px;margin-top:12px}.warn{color:#a83224;font-weight:800}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.grid,.grid2{grid-template-columns:1fr}.mini{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="brand">IDOMED • Gestão Avaliativa</div><div><a class="btn light" href="professor-area.html">← Área do Professor</a> <button class="light" onclick="logout()">Sair</button></div></header><div class="container"><div class="card"><div class="top"><div><span class="badge" id="code">DISCIPLINA</span><h1 id="title">Carregando...</h1><p class="muted">Visão longitudinal de turmas, alunos, avaliações e desempenho consolidado.</p></div><a class="btn primary" href="avaliacao.html">+ Nova avaliação</a></div></div><div class="stats"><div class="stat"><span>Turmas</span><b id="sClasses">–</b></div><div class="stat"><span>Alunos</span><b id="sStudents">–</b></div><div class="stat"><span>Avaliações</span><b id="sAssessments">–</b></div><div class="stat"><span>Média geral</span><b id="sAverage">–</b></div><div class="stat"><span>Mediana</span><b id="sMedian">–</b></div><div class="stat"><span>Alunos &lt; 60%</span><b id="sAttention">–</b></div></div><div class="card"><h2>Cadastrar nova turma</h2><div class="grid2"><div><label>Nome da turma</label><input id="className" placeholder="Ex.: T8 A"></div><div><label>Período / semestre</label><input id="classTerm" placeholder="Ex.: 2026.2"></div></div><div style="margin-top:12px"><button class="primary" onclick="createClass()">+ Cadastrar turma</button></div><div id="classMsg"></div></div><div class="top"><h2>Turmas da disciplina</h2></div><div id="classes" class="grid"></div></div><script>const DASH='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-academic-dashboard',PROF='https://lvdzsqqimxbhxezaiwlr.supabase.co/functions/v1/platform-professor',token=sessionStorage.getItem('platform_access_token'),role=sessionStorage.getItem('platform_role'),$=id=>document.getElementById(id),COURSE_ID=new URLSearchParams(location.search).get('course_id')||'';if(!token||role!=='professor')location.href='plataforma.html';if(!COURSE_ID)location.href='professor-area.html';async function call(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'erro');return d}function logout(){sessionStorage.clear();location.href='plataforma.html'}function pct(v){return v==null?'—':Number(v).toFixed(1)+'%'}function msg(t){$('classMsg').innerHTML=`<div class="notice">${t}</div>`}async function load(){try{const d=await call(DASH,{action:'course_dashboard',course_id:COURSE_ID});$('code').textContent=d.course.code||'DISCIPLINA';$('title').textContent=d.course.name;$('sClasses').textContent=d.summary.classes;$('sStudents').textContent=d.summary.students;$('sAssessments').textContent=d.summary.assessments;$('sAverage').textContent=pct(d.summary.average_percent);$('sMedian').textContent=pct(d.summary.median_percent);$('sAttention').textContent=d.summary.students_below_60??0;$('classes').innerHTML=d.classes.length?d.classes.map(c=>`<div class="card class-card"><span class="badge">${c.term||'Período não informado'}</span><h3>${c.name}</h3><div class="mini"><div><span class="muted">Alunos</span><b>${c.student_count}</b></div><div><span class="muted">Avaliações</span><b>${c.assessment_count}</b></div><div><span class="muted">Média</span><b>${pct(c.average_percent)}</b></div><div><span class="muted">Mediana</span><b>${pct(c.median_percent)}</b></div><div><span class="muted">Atenção</span><b class="${c.students_below_60?'warn':''}">${c.students_below_60||0}</b></div></div><div class="muted">${c.completed_results||0} resultado(s) finalizado(s) • ${c.students_above_80||0} aluno(s) ≥ 80%</div><div style="margin-top:14px"><a class="btn primary" href="turma-painel.html?class_id=${encodeURIComponent(c.id)}">Abrir turma</a></div></div>`).join(''):'<div class="card"><p class="muted">Nenhuma turma cadastrada nesta disciplina.</p></div>'}catch(e){$('classes').innerHTML='<div class="card">Não foi possível carregar a disciplina.</div>'}}async function createClass(){const name=$('className').value.trim(),term=$('classTerm').value.trim();if(!name){msg('Informe o nome da turma.');return}try{await call(PROF,{action:'create_class',course_id:COURSE_ID,name,term});$('className').value='';$('classTerm').value='';msg('Turma cadastrada com sucesso.');await load()}catch(e){msg('Não foi possível cadastrar: '+e.message)}}load();</script></body></html>
